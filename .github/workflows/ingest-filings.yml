name: Batch SEC EDGAR & Filing Diff Pipeline

on:
  schedule:
    # Run daily at 06:00 UTC (after overnight SEC EDGAR filings settle)
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync SEC EDGAR XBRL Financials
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'AmberFinance research@amber.example' }}
          UNIVERSE_LIMIT: "750"
        run: pnpm ingest:edgar

      - name: Sync Latest EOD Share Prices & Market Caps
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm sync:prices

      - name: Upsert into Neon Postgres (when configured)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:seed

      - name: Extract Incremental 10-K Prose Diffs (2-Stage Neon-Backed)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'AmberFinance research@amber.example' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_TICKERS: "35"
        run: pnpm ingest:diffs

      - name: Close Prior Period Arena Leaderboards (Idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --experimental-strip-types scripts/close-arena-month.ts

      - name: Sync SEC Form 4 Open-Market Insider Activity
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'AmberFinance research@amber.example' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm ingest:form4

      - name: Dispatch Filing Alerts via Resend (when configured)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AMBER_PROD_URL: ${{ secrets.AMBER_PROD_URL }}
        run: pnpm send:alerts

      - name: Trigger Vercel On-Demand ISR Revalidation (when configured)
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          AMBER_PROD_URL: ${{ secrets.AMBER_PROD_URL }}
        run: |
          if [ -n "$REVALIDATE_SECRET" ] && [ -n "$AMBER_PROD_URL" ]; then
            curl -fsS -X POST "${AMBER_PROD_URL}/api/revalidate" \
              -H "Authorization: Bearer ${REVALIDATE_SECRET}" \
              -H "Content-Type: application/json" \
              -d '{}'
          else
            echo "Skipping ISR revalidation (REVALIDATE_SECRET or AMBER_PROD_URL not set)."
          fi
