name: Batch SEC EDGAR & Filing Diff Pipeline

on:
  schedule:
    # Run daily at 06:00 UTC (after overnight SEC EDGAR filings settle)
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync SEC EDGAR XBRL Financials
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'AmberFinance research@amber.example' }}
          UNIVERSE_LIMIT: "500"
        run: pnpm ingest:edgar

      - name: Sync Latest EOD Share Prices & Market Caps
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm sync:prices

      - name: Extract Incremental 10-K Text Diffs (Deterministic)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'AmberFinance research@amber.example' }}
          MAX_TICKERS: "10"
        run: pnpm ingest:diffs

      - name: Upsert into Neon Postgres (when configured)
        if: ${{ secrets.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:seed

      - name: Dispatch Filing Alerts via Resend (when configured)
        if: ${{ secrets.RESEND_API_KEY != '' && secrets.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AMBER_PROD_URL: ${{ secrets.AMBER_PROD_URL }}
        run: pnpm send:alerts

      - name: Trigger Vercel On-Demand ISR Revalidation (when configured)
        if: ${{ secrets.REVALIDATE_SECRET != '' && secrets.AMBER_PROD_URL != '' }}
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          AMBER_PROD_URL: ${{ secrets.AMBER_PROD_URL }}
        run: |
          curl -fsS -X POST "${AMBER_PROD_URL}/api/revalidate" \
            -H "Authorization: Bearer ${REVALIDATE_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}'
