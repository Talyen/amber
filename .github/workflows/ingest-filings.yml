name: Batch SEC EDGAR & Filing Diff Pipeline

on:
  schedule:
    # Run daily at 06:00 UTC (after overnight SEC EDGAR filings settle)
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: amber-sec-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      UNIVERSE_LIMIT: "900"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync SEC EDGAR XBRL Financials
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'AmberStocks research@amberstocks.com' }}
          AMBER_INGEST_UNIVERSE_PATH: ${{ runner.temp }}/amber-ingest-universe.json
        run: pnpm ingest:edgar

      - name: Sync Latest EOD Share Prices & Market Caps
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm sync:prices

      - name: Upsert into Neon Postgres (when configured)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AMBER_INGEST_UNIVERSE_PATH: ${{ runner.temp }}/amber-ingest-universe.json
        run: pnpm db:seed

      - name: Extract Incremental 10-K / 10-Q Prose Diffs (2-Stage Neon-Backed)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'AmberStocks research@amberstocks.com' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_TICKERS: "75"
        run: pnpm ingest:diffs

      - name: Close Prior Period Arena Leaderboards (Idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --experimental-strip-types scripts/close-arena-month.ts

      - name: Sync High-Signal SEC Form 8-K Material Events
        id: ingest_8k
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'AmberStocks research@amberstocks.com' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAX_8K_TICKERS: ${{ env.UNIVERSE_LIMIT }}
        run: pnpm ingest:8k

      - name: Sync SEC DEF 14A Proxy Executive Comp & SBC Disclosures
        id: ingest_proxy
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'AmberStocks research@amberstocks.com' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAX_PROXY_TICKERS: "150"
        run: pnpm ingest:proxy

      - name: Sync SEC Form 4 Open-Market Insider Activity
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'AmberStocks research@amberstocks.com' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm ingest:form4

      - name: Dispatch Filing Alerts via Resend
        id: send_alerts
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ vars.ALERT_FROM_EMAIL }}
          AMBER_PROD_URL: ${{ secrets.AMBER_PROD_URL }}
        run: |
          if [ -z "${RESEND_API_KEY//[[:space:]]/}" ]; then
            echo "::error title=Filing alerts unavailable::The RESEND_API_KEY GitHub Actions secret is missing. Filing ingestion and cache revalidation can still complete."
            exit 1
          fi
          pnpm send:alerts --require-config

      - name: Trigger Vercel On-Demand ISR Revalidation (when configured)
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          AMBER_PROD_URL: ${{ secrets.AMBER_PROD_URL }}
        run: |
          if [ -n "$REVALIDATE_SECRET" ] && [ -n "$AMBER_PROD_URL" ]; then
            curl -fsS -X POST "${AMBER_PROD_URL}/api/revalidate" \
              -H "Authorization: Bearer ${REVALIDATE_SECRET}" \
              -H "Content-Type: application/json" \
              -d '{}'
          else
            echo "Skipping ISR revalidation (REVALIDATE_SECRET or AMBER_PROD_URL not set)."
          fi

      - name: Report incomplete filing ingestion or alert delivery
        if: ${{ !cancelled() && (steps.ingest_8k.outcome == 'failure' || steps.ingest_proxy.outcome == 'failure' || steps.send_alerts.outcome == 'failure') }}
        run: exit 1
